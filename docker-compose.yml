services:
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-vibe-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      # Persistent vector database storage on host / named volume
      - chroma_data:/app/data/chroma_db
      - upload_data:/app/data/uploads
    environment:
      - APP_ENV=production
      - CHROMA_PERSIST_DIRECTORY=data/chroma_db
      - UPLOAD_DIRECTORY=data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

volumes:
  chroma_data:
    driver: local
  upload_data:
    driver: local
